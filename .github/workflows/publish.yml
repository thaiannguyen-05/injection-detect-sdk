name: publish
on:
  push:
    tags: ['v*.*.*', 'v*.*.*-*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.3 or 1.2.3-beta.1). Empty = auto dev version, no npm publish, dry-run only'
        required: false
        default: ''
      npm_tag:
        description: 'npm dist-tag'
        required: false
        default: 'latest'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check NPM_TOKEN
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::Missing NPM_TOKEN secret. Create an Automation token at npmjs.com (thaiandev account) and add it as repo secret NPM_TOKEN."
            exit 1
          fi
      - name: Resolve dynamic version
        id: ver
        run: |
          chmod +x ./scripts/resolve-version.sh
          ./scripts/resolve-version.sh "${{ github.event.inputs.version }}" "${{ github.ref }}"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - run: npm test
      - name: Verify npm auth
        run: npm whoami --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish dry-run (no version input and no tag)
        if: steps.ver.outputs.published != 'true'
        run: npm pack --dry-run
      - name: Publish to npm (@thaiandev scope)
        if: steps.ver.outputs.published == 'true'
        run: npm publish --tag "${NPM_TAG:-latest}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ github.event.inputs.npm_tag }}
      - name: GitHub Release
        if: steps.ver.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: '*.tgz'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
